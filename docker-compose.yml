services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: orpheus-server
    restart: unless-stopped
    ports:
      - "3010:3000"
    env_file:
      - ./server/.env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DB_PATH: /app/data/orpheus.db
      OLLAMA_HOST: http://ollama:11434
      # AI_ENABLED is opt-in (defaults to false when unset).
      # Set AI_ENABLED=true in server/.env when using: docker compose --profile ai up
    volumes:
      - server-data:/app/data
    depends_on:
      ollama:
        condition: service_started
        required: false

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: orpheus-client
    restart: unless-stopped
    ports:
      - "8085:80"
    depends_on:
      - server

  ollama:
    image: ollama/ollama:latest
    container_name: orpheus-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    profiles:
      - ai

volumes:
  server-data:
  ollama-data:
