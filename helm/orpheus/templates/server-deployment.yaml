apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orpheus.server.fullname" . }}
  labels:
    {{- include "orpheus.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: orpheus
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orpheus
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      terminationGracePeriodSeconds: 30
      containers:
        - name: server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.server.port | quote }}
            - name: HOST
              value: "0.0.0.0"
            - name: DB_PATH
              value: "/data/orpheus.db"
            - name: LOG_LEVEL
              value: {{ .Values.server.logLevel | quote }}
            - name: AI_ENABLED
              value: {{ .Values.ollama.enabled | quote }}
            {{- if .Values.ollama.enabled }}
            - name: OLLAMA_HOST
              value: {{ include "orpheus.ollama.url" . | quote }}
            - name: OLLAMA_MODEL
              value: {{ .Values.ollama.model | quote }}
            {{- end }}
            {{- range .Values.server.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-spotify
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.server.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "orpheus.server.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
