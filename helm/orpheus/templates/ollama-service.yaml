{{- if .Values.ollama.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orpheus.ollama.fullname" . }}
  labels:
    {{- include "orpheus.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.ollama.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: orpheus
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ollama
{{- end }}
