apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orpheus.client.fullname" . }}-nginx
  labels:
    {{- include "orpheus.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Flutter web SPA — serve index.html for all non-file routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Reverse proxy: REST API
        location /api/ {
            proxy_pass http://{{ include "orpheus.server.fullname" . }}:{{ .Values.server.port }}/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Reverse proxy: WebSocket
        location /ws {
            proxy_pass http://{{ include "orpheus.server.fullname" . }}:{{ .Values.server.port }}/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
