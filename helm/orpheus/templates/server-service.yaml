apiVersion: v1
kind: Service
metadata:
  name: {{ include "orpheus.server.fullname" . }}
  labels:
    {{- include "orpheus.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.server.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: orpheus
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: server
