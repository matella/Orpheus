name: orpheus
description: Orpheus — Autonomous Music Intelligence Client
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2

  # HTTP & WebSocket
  dio: ^5.9.1
  web_socket_channel: ^3.0.3

  # Routing
  go_router: ^17.1.0

  # UI
  fl_chart: ^1.1.1
  flutter_svg: ^2.2.3
  cached_network_image: ^3.4.1
  google_fonts: ^8.0.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.0
  just_audio: ^0.9.40

  # Data Classes
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
