name: orpheus
description: Orpheus — Autonomous Music Intelligence Client
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.2.1

  # HTTP & WebSocket
  dio: ^5.9.1
  web_socket_channel: ^3.0.3

  # Routing
  go_router: ^18.0.1

  # UI
  fl_chart: ^1.1.1
  flutter_svg: ^2.2.3
  cached_network_image: ^4.0.0
  google_fonts: ^8.0.2
  url_launcher: ^6.3.0
  just_audio: ^0.10.6
  cupertino_icons: ^1.0.8

  # Data Classes

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
